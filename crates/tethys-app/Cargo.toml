[package]
name = "tethys-app"
description = "Tethys GPUI application: composition root and views."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tethys"
path = "src/main.rs"

[dependencies]
tethys-core.workspace = true
tethys-adapters.workspace = true
gpui-kit.workspace = true
rfd.workspace = true
futures.workspace = true
gpui-component.workspace = true

[dev-dependencies]
# Headless windows, clicks and keys for view tests (`#[gpui_kit::test]`).
gpui-kit = { workspace = true, features = ["test-support"] }

[build-dependencies]
winresource = "0.1"
