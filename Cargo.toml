[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
tethys-core = { path = "crates/tethys-core" }
tethys-adapters = { path = "crates/tethys-adapters" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "3.2"
quick-xml = "0.42"
futures = "0.3"
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
# Only to pick ring as the TLS crypto provider for ureq (ring is already in the tree).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
self-replace = "1.5"

gpui-kit = "=0.7.1"
# Only to enable syntax highlighting grammars; the code uses it through gpui-kit.
gpui-component = { version = "=0.7.1", features = [
    "tree-sitter",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-toml",
    "tree-sitter-python",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-yaml",
    "tree-sitter-bash",
] }
alacritty_terminal = "=0.26.0"
rfd = "0.17"
winreg = "0.56"
# Only for DbgEng's COM interfaces (the debugger); windows-sys has no COM.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug_Extensions",
    "Win32_System_Threading",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
