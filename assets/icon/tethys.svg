<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Tethys, the moon, in the Telesto Games brand: plum #0B001F, broadcast orange #F24B38.
       An agent prompt (>_) on the moon, above the Telesto horizon line. -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#0B001F"/>
  <rect x="9" y="9" width="238" height="238" rx="43" fill="none" stroke="#F24B38" stroke-opacity="0.35" stroke-width="2"/>
  <!-- the moon -->
  <circle cx="128" cy="132" r="74" fill="#F24B38"/>
  <!-- prompt: > and _ in plum -->
  <polyline points="90,86 116,106 90,126" fill="none" stroke="#0B001F" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="124" y="116" width="40" height="12" fill="#0B001F"/>
  <!-- horizon: a plum gap across the moon, then the orange line through it -->
  <rect x="40" y="141" width="176" height="22" fill="#0B001F"/>
  <rect x="26" y="148" width="204" height="8" fill="#F24B38"/>
</svg>
