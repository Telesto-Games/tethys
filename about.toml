# `cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md`. Same list as deny.toml.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "MPL-2.0",
]

# These crates don't ship their license file: take it from the repository at the
# commit the crate was published from (checksums pin the exact text).

[tree-sitter-bash.clarify]
license = "MIT"

[[tree-sitter-bash.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "49bf33cf78ef5897e4e161ce1517df7de1ae5042a65b6bcfd44401e0fc606559"

